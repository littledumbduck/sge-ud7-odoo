  <line x1="212" y1="166" x2="500" y2="166" stroke="#5e4766" stroke-width="2"/>
  <text x="212" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" letter-spacing="1" fill="#010101">Pan de masa madre · Pastelería · Catering</text>
